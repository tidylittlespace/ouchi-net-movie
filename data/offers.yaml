# 案件マスタ。ASP（A8.net / もしもアフィリエイト / afb / バリューコマース / アクセストレード等）で
# 提携承認された案件の広告リンクをここに集約する。記事中は {{offer:slug}} で参照するため、
# リンク差し替え・案件終了はこのファイルを直すだけで全記事に反映される。
#
# 以下はすべてサンプル。必ず自分の提携リンク・報酬額・特徴に置き換えること。
#
# 項目:
#   url         ASP の広告リンク（テキストリンク用 URL）
#   banner_html ASP の「バナー広告コード」をそのまま貼る（任意。紹介ボックスの上部に表示）
#   reward      1 成果あたり報酬（円）。記事には出ない。管理用
#   end_date    案件終了日（YYYY-MM-DD）。過ぎると link check が警告

