# 案件マスタ。ASP（A8.net / もしもアフィリエイト / afb / バリューコマース / アクセストレード等）で
# 提携承認された案件の広告リンクをここに集約する。記事中は {{offer:slug}} で参照するため、
# リンク差し替え・案件終了はこのファイルを直すだけで全記事に反映される。
# 承認前の案件は入れない（比較表 {{offer-table:vod}} は、このファイルの vod 案件をすべて並べる）。
#
# 項目:
#   url         ASP の広告リンク（テキストリンク用 URL）
#   banner_html ASP の「バナー広告コード」をそのまま貼る（任意。紹介ボックスの上部に表示）
#   reward      1 成果あたり報酬（円）。記事には出ない。管理用
#   end_date    案件終了日（YYYY-MM-DD）。過ぎると link check が警告

# ---- 動画配信 ----
# afb（サイトID 999050）。2026-11-03 提携。運営者は未加入のため、使い心地は書かない。
# 料金・ポイントは変わることがある。広告ページ（afb 提携中 PID:16300）で2026-11-03 に確認した内容。
- slug: crankin-video
  name: "クランクイン！ビデオ"
  category: vod
  url: "https://t.afi-b.com/visit.php?a=Q16300l-9524037n&p=e999050A"
  banner_html: ""
  reward: 1861
  catch: "新作映画をポイントで観たい人向け"
  points:
    - "月額1,650円（税込）で、毎月2,200ポイントがもらえる"
    - "ポイントは翌月末まで持ち越せる"
    - "パソコン・テレビ・スマホ・タブレットで観られ、作品のダウンロードもできる"
    - "私は未加入なので、使い心地は書けません。最新の料金は公式サイトで確認してください"
  end_date: ""

